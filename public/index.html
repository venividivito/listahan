<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Listahan</title>
<style>
@font-face{font-family:"Google Sans";src:url(fonts/GoogleSans-Variable.woff2) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
:root{--bg:#f5f7f2;--card:#fff;--tx:#1b2118;--mu:#66705f;--ac:#4d7c0f;--on:#fff;--ln:#dfe5d8;--ok:#0f766e;--bad:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Material 3 roles derived from the active palette */
:root{--outl:color-mix(in srgb,var(--mu) 70%,var(--card));--tonal:color-mix(in srgb,var(--ac) 14%,var(--card));--hi:color-mix(in srgb,var(--tx) 8%,var(--card));--sh1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);--sh3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/24px "Google Sans","Google Sans Text",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.5px}
.w{max-width:640px;margin:0 auto;padding:14px 16px 80px}
h1{font-size:24px;line-height:32px;font-weight:400;letter-spacing:0;margin:4px 0 12px}h2{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px;margin:0 0 12px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 12px}.hdr h1{margin:0;flex:none}
/* "listahan" in Jasendira lettering, drawn as SVG so it can be written out */
.logo{position:relative;width:104px;height:48px;line-height:0;visibility:hidden}
.logo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.logo .df{width:0;height:0;overflow:hidden}
.logo .mk{fill:none;stroke:#fff;stroke-width:700;stroke-linejoin:round;stroke-dashoffset:0}
.logo .fl{fill:var(--tx)}
.logo.still,.logo.play{visibility:visible}
#me{display:flex;align-items:center;gap:10px;min-width:0}
#me .gr{font-size:13px;line-height:18px;letter-spacing:.2px;text-align:right;min-width:0;overflow-wrap:anywhere}
.av{position:relative;flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:0;border-radius:50%;border:1px solid var(--ln);background:var(--tonal);color:var(--tx);font-size:18px;font-weight:500;letter-spacing:0;cursor:pointer}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av input{display:none}
.av i{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--ac);color:var(--on);font:normal 10px/18px system-ui,sans-serif;text-align:center;border:2px solid var(--bg)}
nav{display:flex;margin-bottom:16px;overflow-x:auto;border-bottom:1px solid var(--ln)}
nav button{flex:1;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:12px}
.sub{border-top:1px dashed var(--ln);padding-top:10px;margin-top:10px}
button,input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px 16px;min-height:40px}
button{cursor:pointer;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;background-color:var(--tonal);border-color:transparent;color:var(--tx);transition:background-color .15s,box-shadow .15s}
button:hover{background-image:linear-gradient(color-mix(in srgb,currentColor 8%,transparent),color-mix(in srgb,currentColor 8%,transparent))}
button:active{background-image:linear-gradient(color-mix(in srgb,currentColor 10%,transparent),color-mix(in srgb,currentColor 10%,transparent))}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.38;cursor:default;background-image:none}
button.pri{background-color:var(--ac);color:var(--on);width:100%;margin-top:12px}
nav button{background:none;border:0;border-radius:0;position:relative;min-height:48px;color:var(--mu)}
nav button.on{background-color:transparent;color:var(--ac)}
nav button.on::after{transform:scaleX(1)}
nav button::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ac);transform:scaleX(0);transition:transform .2s cubic-bezier(.2,0,0,1)}
nav button{transition:color .2s}
#app.out{opacity:0;transform:translateY(8px);transition:opacity .12s ease-in,transform .12s ease-in}
#app.in{animation:vin .22s cubic-bezier(.2,0,0,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
input,select{width:100%;min-height:48px;border-color:var(--outl);border-radius:4px;background:transparent;font-size:16px;letter-spacing:.5px;padding:8px 16px}
select{-webkit-appearance:none;appearance:none;padding-right:44px;background-color:transparent;background-repeat:no-repeat;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 23px) calc(50% + 1px),calc(100% - 17px) calc(50% + 1px);background-size:6px 6px,6px 6px}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:48px;padding-top:0;padding-bottom:0;line-height:46px;text-align:left;text-align-last:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;height:46px;min-height:0;line-height:46px;margin:0;padding:0}
input[type=date]::-webkit-datetime-edit{padding:0;line-height:46px}
input[type=date]::-webkit-datetime-edit-fields-wrapper{padding:0}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.7}
.row:has(input[type=date]){align-items:flex-start}
label.g1,label.g2{min-width:0}
label{display:block;font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--mu);margin-bottom:8px}
label input,label select{margin-top:4px;color:var(--tx);font-size:16px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>*{min-width:0}.g2{flex:2}.g1{flex:1}
.x{flex:none;width:48px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.chip{padding:6px 16px;min-height:32px;border-radius:8px;background-color:transparent;border:1px solid var(--ln);color:var(--mu)}
.chip.on{background-color:var(--tonal);border-color:transparent;color:var(--tx)}
.sw2{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px;border:1px solid var(--ln)}
.lb,.mu{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--mu);margin:6px 0 2px}
.pr{display:flex;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln);align-items:center}
.pr span:first-child{flex:1}.tt{font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.badge{font-size:12px;line-height:16px;letter-spacing:.5px;font-weight:500;padding:2px 8px;border-radius:8px;border:1px solid var(--ln);color:var(--mu)}
.badge.Settled{color:var(--ok);border-color:var(--ok)}.badge.Unpaid{color:var(--bad);border-color:var(--bad)}.badge.Partial{color:var(--ac);border-color:var(--ac)}
.hd{display:flex;justify-content:space-between;gap:8px;cursor:pointer;align-items:center}
.sm{min-height:32px;padding:4px 12px;background-color:transparent;border-color:var(--outl);color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);font-size:14px;line-height:20px;letter-spacing:.25px;padding:14px 16px;min-height:48px;border-radius:4px;box-shadow:var(--sh3);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.s{opacity:1}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:calc(48px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}
#lb button{position:absolute;width:42px;padding:0;border-radius:99px;background-color:var(--bg);border:1px solid var(--ln)}
#lb .c{top:calc(8px + env(safe-area-inset-top,0px));right:12px}
#lb .p,#lb .n{top:50%;transform:translateY(-50%);min-height:48px;width:40px;opacity:.9}
#lb .p{left:6px}#lb .n{right:6px}
#lb span{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);color:#fff;font-size:14px}
.sw{display:flex;align-items:center;gap:12px;font-size:12px;line-height:16px;color:var(--mu);cursor:pointer;margin:0;user-select:none}
.sw input{display:none}
.sw i{position:relative;width:52px;height:32px;border-radius:99px;border:2px solid var(--outl);background:var(--hi);transition:background .2s,border-color .2s;flex:none}
.sw i::after{content:'';position:absolute;top:50%;left:6px;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--outl);transition:transform .2s,width .2s,height .2s,margin-top .2s,left .2s,background .2s}
.sw input:checked+i{background:var(--ac);border-color:var(--ac)}
.sw input:checked+i::after{left:2px;width:24px;height:24px;margin-top:-12px;background:var(--on);transform:translateX(20px)}
</style>

let palette=PAL[localStorage.getItem('palette')]?localStorage.getItem('palette'):'matcha',mode=['light','dark'].includes(localStorage.getItem('mode'))?localStorage.getItem('mode'):'system';
const darkMQ=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const d=mode==='dark'||(mode==='system'&&darkMQ.matches),r=document.documentElement.style;
 PAL[palette][d?'dark':'light'].forEach((v,i)=>r.setProperty('--'+['bg','card','tx','mu','ac','on','ln','ok','bad'][i],v));

applyTheme();

/* ---------- calculation ---------- */
function calc(m){
 const A=m.attendees||[],S={},E={},L=[];A.forEach(p=>{S[p]=0;E[p]=0});
 (m.items||[]).forEach(it=>{const ps=(it.people||[]).filter(p=>p in S);if(!ps.length)return;const c=Math.round((+it.price||0)*100)/ps.length;ps.forEach(p=>S[p]+=c)});
 (m.extras||[]).forEach(x=>{const ps=(x.people||[]).filter(p=>p in S);if(!ps.length)return;
  const b=ps.reduce((a,p)=>a+S[p],0),v=+x.value||0,amt=(x.type==='pct'?b*v/100:v*100)*(x.sign<0?-1:1);
  ps.forEach(p=>{const w=(x.mode==='equal'||b===0)?1/ps.length:S[p]/b;E[p]+=amt*w;L.push({p,label:x.label,v:amt*w})})});
 const f=A.map(p=>S[p]+E[p]),sum=Math.round(f.reduce((a,b)=>a+b,0)),t=f.map(Math.floor);let r=sum-t.reduce((a,b)=>a+b,0);
 f.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(r>0){t[i]++;r--}});
 return{S,E,L,tot:t,sum};
}
function ledger(){
 const pool={},dir={},owed={},paid={},st={};
 pays.forEach(p=>{const k=p.from+'>'+p.to,c=Math.round(p.amount*100);paid[k]=(paid[k]||0)+c;
  if(p.meal)dir[p.meal+'|'+p.from]=(dir[p.meal+'|'+p.from]||0)+c;else pool[k]=(pool[k]||0)+c});
 [...meals].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created||0)-(b.created||0)).forEach(m=>{
  const c=calc(m);st[m.id]={};
  m.attendees.forEach((p,i)=>{if(p===m.payer)return;const k=p+'>'+m.payer,o=c.tot[i];owed[k]=(owed[k]||0)+o;
   const dd=dir[m.id+'|'+p]||0,d=Math.min(o,dd);pool[k]=(pool[k]||0)+(dd-d);
   const x=Math.min(o-d,pool[k]);pool[k]-=x;st[m.id][p]={o,paid:d+x}})});
 const rows=[];
 members.forEach((a,i)=>members.slice(i+1).forEach(b=>{
  let x=(owed[a.id+'>'+b.id]||0)-(paid[a.id+'>'+b.id]||0),y=(owed[b.id+'>'+a.id]||0)-(paid[b.id+'>'+a.id]||0);
  if(autoNet){const n=x-y;if(n>0)rows.push({d:a.id,c:b.id,n});else if(n<0)rows.push({d:b.id,c:a.id,n:-n});return}
  // overpayment in one direction becomes a debt in the other
  if(x<0){y-=x;x=0}if(y<0){x-=y;y=0}
  if(x>0)rows.push({d:a.id,c:b.id,n:x});if(y>0)rows.push({d:b.id,c:a.id,n:y})}));
 return{st,rows};
}
const status=(m,L)=>{const r=Object.values(L.st[m.id]||{});return !r.length?'—':r.every(x=>x.paid>=x.o)?'Settled':r.some(x=>x.paid>0)?'Partial':'Unpaid'};

function drawLogo(t){

 let from=0;ms.forEach((m,i)=>{const L=lgLens[i],p=Math.min(Math.max((u*lgTot-from)/L,0),1);from+=L;
  m.style.strokeDasharray=`${L}px ${L*2}px`;m.style.strokeDashoffset=(L*(1-p))+'px';m.style.strokeWidth=w+'px'})}
function setLogo(mode){const l=$('#logo');if(!l)return;cancelAnimationFrame(lgRaf);

 drawLogo(0);l.className='logo play';

 const step=now=>{const t=Math.min((now-t0)/D,1);drawLogo(t);if(t<1)lgRaf=requestAnimationFrame(step);else{ms.forEach(m=>m.style.cssText='');l.className='logo still'}};

function det(m,p){const c=calc(m),i=m.attendees.indexOf(p);let h='';
 m.items.forEach(it=>{if(it.people.includes(p)){const n=it.people.length;h+=`<div class="pr"><span>${esc(it.name||'Item')}${n>1?` <span class="mu">(1/${n} of ${peso(it.price*100)})</span>`:''}</span><span>${peso(it.price*100/n)}</span></div>`}});

 const list=ids.map(id=>({id,ow:owes(L,id),ot:owedTo(L,id),net:owedTo(L,id)-owes(L,id)})).sort((a,b)=>autoNet?Math.abs(b.net)-Math.abs(a.net):(b.ow+b.ot)-(a.ow+a.ot));
 const amt=x=>autoNet?`<span class="${x.net<0?'bad':x.net>0?'ok':'mu'}">${x.net<0?'owes '+peso(-x.net):x.net>0?'is owed '+peso(x.net):'settled'}</span>`
  :`<span style="text-align:right">${!x.ow&&!x.ot?'<span class="mu">settled</span>':[x.ow?`<span class="bad">owes ${peso(x.ow)}</span>`:'',x.ot?`<span class="ok">is owed ${peso(x.ot)}</span>`:''].filter(Boolean).join('<br>')}</span>`;
 h+=`<div class="card"><div class="hd" style="cursor:default;margin-bottom:6px"><h2 style="margin:0">Balances</h2><label class="sw"><span>Auto-net</span><input type="checkbox" ${autoNet?'checked':''} onchange="setNet(this.checked)"><i></i></label></div><div class="mu">${autoNet?'Mutual debts are offset against each other.':'Mutual debts are shown separately, not offset.'} Tap a name to see their breakdown and record payments.</div>`+list.map(x=>`<div class="pr hd" onclick="openP('${x.id}')"><span><b>${esc(nm(x.id))}</b></span>${amt(x)}<span class="mu">›</span></div>`).join('')+'</div>';

}

 try{await T('members').add({name:v,created:Date.now()});$('#nn').value=''}catch(e){toast('Could not add')}}

async function saveName(k){const v=$('#ed').value.trim(),[type,id]=k.split(':');if(!v)return toast('Name can\'t be empty');
 const list=type==='t'?teams:members;if(list.some(x=>x.id!==id&&(x.name||'').toLowerCase()===v.toLowerCase()))return toast('That name is already used');

async function delTeam(id){const t=teams.find(x=>x.id===id);if(!t)return;
 const v=prompt(`This permanently deletes "${t.name}" and all its people, expenses and payments. Access to it is removed for everyone.\n\nType the team name to confirm:`);
 if(v==null)return;if(v.trim()!==t.name)return toast('Name didn\'t match. Nothing deleted.');
 try{toast('Deleting…');const tr=db.collection('teams').doc(id),ops=[];
  for(const n of ['members','meals','payments'])(await tr.collection(n).get()).docs.forEach(d=>ops.push(b=>b.delete(d.ref)));
  roles.filter(r=>r.teams&&id in r.teams).forEach(r=>ops.push(b=>b.update(db.collection('roles').doc(r.id),{['teams.'+id]:firebase.firestore.FieldValue.delete()})));
  // team doc last, so a failed run can be retried from the list
  ops.push(b=>b.delete(tr));
  for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}
  toast('Team deleted')}catch(e){toast('Delete failed: '+(e.code||e.message||''))}}
async function addTeam(){const v=$('#tn').value.trim();if(!v)return;if(teams.some(t=>(t.name||'').toLowerCase()===v.toLowerCase()))return toast('Team already exists');
 try{const r=await db.collection('teams').add({name:v,created:Date.now()});openTeam(r.id);toast('Team created')}catch(e){toast('Could not create team')}}
async function migrate(){const name=$('#lg').value.trim();if(!name)return toast('Name the team');
 try{toast('Moving…');const tr=db.collection('teams').doc(),ops=[];
  for(const n of ['members','meals','payments'])(await db.collection(n).get()).docs.forEach(d=>ops.push(b=>b.set(tr.collection(n).doc(d.id),d.data())));
  roles.filter(r=>r.member).forEach(r=>ops.push(b=>b.set(db.collection('roles').doc(r.id),{teams:{[tr.id]:r.member},member:firebase.firestore.FieldValue.delete()},{merge:true})));
  // team doc last, so the move card only disappears once everything is copied
  ops.push(b=>b.set(tr,{name,created:Date.now(),legacy:true}));
  for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}
  openTeam(tr.id);toast('Moved into '+name)}catch(e){toast('Move failed: '+(e.code||e.message||''))}}

(async function(){
 const fail=()=>{logoStill();$('#app').innerHTML='<div class="card">Couldn’t connect to Firebase. Check the firebaseConfig at the top of the script and your Firestore rules.</div>'};

 try{firebase.initializeApp(firebaseConfig);db=firebase.firestore()}catch(e){db=null}
 clearTimeout(t);if(!db||firebaseConfig.projectId==='PASTE_PROJECT_ID')return fail();
 let rsub=null,mode0=null;

 const err=e=>toast('Sync problem: '+(e.code||''));
 const stop=()=>{[...gsubs,...tsubs].forEach(f=>f());gsubs=[];tsubs=[];mode0=null;teams=[]};
 firebase.auth().onAuthStateChanged(u=>{
  rsub?.();rsub=null;stop();user=u;role=null;me='';members=[];meals=[];pays=[];roles=[];legacy=false;seenM=false;tab='bal';bp=null;D=null;
  if(u&&!lgIn)playLogo();else if(!u)logoStill();lgIn=!!u;

  $('#app').innerHTML='<div class="card mu">Loading…</div>';
  const noAccess=()=>{stop();gate(`<h2>No access yet</h2><p class="mu">${esc(u.email)} isn’t on a team. Ask an admin to grant access.</p><button onclick="firebase.auth().signOut()">Sign out</button>`)};
  rsub=db.collection('roles').doc((u.email||'').toLowerCase()).onSnapshot(r=>{
   role=r.exists?r.data():null;
   if(!role||(!isAdmin()&&!Object.keys(role.teams||{}).length))return noAccess();
   if(isAdmin()){
    if(mode0==='admin'){me=role.teams?.[cur]||'';return draw()}
    stop();mode0='admin';
    gsubs.push(db.collection('teams').onSnapshot(s=>setTeams(s.docs.map(d=>({id:d.id,...d.data()}))),err));
    gsubs.push(db.collection('roles').onSnapshot(s=>{roles=s.docs.map(d=>({id:d.id,...d.data()}));onData()},err));
    Promise.all(['members','meals','payments'].map(n=>db.collection(n).limit(1).get())).then(x=>{legacy=x.some(s=>!s.empty);onData()}).catch(()=>{});
    return}
   if(mode0==='admin')stop();mode0='contributor';
   Promise.all(Object.keys(role.teams).map(id=>db.collection('teams').doc(id).get()))
    .then(ds=>setTeams(ds.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})))).catch(err);
  },noAccess);
 });
})();
